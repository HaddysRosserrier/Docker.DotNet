name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for NuGet Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install NBGV tool
        run: dotnet tool install --tool-path . nbgv
      - name: Set Version
        run: ./nbgv cloud
      - name: Create Packages
        run: dotnet pack src/Docker.DotNet/Docker.DotNet.csproj -c Release -o packages
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
      # Only tag builds publish; a manual run from a branch just produces the artifact.
      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "./packages/HR.Extended.Docker.DotNet.*.nupkg" --skip-duplicate -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            })
